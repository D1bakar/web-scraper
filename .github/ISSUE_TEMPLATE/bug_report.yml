name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug!
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "2.2.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Scrape Mode
      options:
        - price_compare
        - quotes
        - meta
        - links
        - tables
        - selectors
        - sitemap
        - email_extract
        - json_ld
        - social_meta
        - readability
        - other
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug and expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start server with `start.bat`
        2. Select mode X
        3. Submit URL Y
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error messages
      render: shell
