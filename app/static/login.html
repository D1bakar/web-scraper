<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Sign In — Web Scraper Pro</title>
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <link rel="icon" type="image/x-icon" href="/static/img/favicon.ico">
  <link rel="apple-touch-icon" href="/static/img/icon-192.png">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="login-page">
  <div class="bg-mesh" aria-hidden="true">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
  </div>
  <main class="login-container glass-panel iridescent-border">
    <img src="/static/img/logo.svg" alt="" class="logo logo-login" width="64" height="64" aria-hidden="true">
    <h1 class="gradient-text">Web Scraper Pro</h1>
    <p class="login-subtitle">Sign in to continue</p>
    <form id="login-form" class="login-form">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" autocomplete="username" required inputmode="text">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-glow" id="login-btn">Sign In</button>
      <p id="login-error" class="login-error hidden"></p>
    </form>
  </main>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      btn.disabled = true;
      errEl.classList.add('hidden');
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (!res.ok) {
          const data = await res.json();
          throw new Error(data.detail || 'Login failed');
        }
        window.location.href = '/';
      } catch (err) {
        errEl.textContent = err.message;
        errEl.classList.remove('hidden');
      } finally {
        btn.disabled = false;
      }
    });
    fetch('/api/auth/status', { credentials: 'include' })
      .then((r) => r.json())
      .then((d) => {
        if (!d.auth_enabled || d.authenticated) window.location.href = '/';
      });
  </script>
</body>
</html>
