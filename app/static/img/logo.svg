<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Web Scraper Pro">
  <defs>
    <linearGradient id="wsp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="wsp-glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <filter id="wsp-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Ambient glow -->
  <circle cx="60" cy="60" r="52" fill="url(#wsp-glow)" filter="url(#wsp-blur)"/>

  <!-- Outer ring  liquid glass border -->
  <circle cx="60" cy="60" r="48" stroke="url(#wsp-grad)" stroke-width="1.5" opacity="0.6"/>
  <circle cx="60" cy="60" r="44" fill="rgba(99,102,241,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Globe meridians -->
  <ellipse cx="60" cy="60" rx="28" ry="28" stroke="url(#wsp-grad)" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="60" cy="60" rx="18" ry="28" stroke="url(#wsp-grad)" stroke-width="1" opacity="0.35"/>
  <ellipse cx="60" cy="60" rx="8" ry="28" stroke="url(#wsp-grad)" stroke-width="0.8" opacity="0.25"/>
  <line x1="32" y1="60" x2="88" y2="60" stroke="url(#wsp-grad)" stroke-width="0.8" opacity="0.3"/>
  <line x1="60" y1="32" x2="60" y2="88" stroke="url(#wsp-grad)" stroke-width="0.8" opacity="0.3"/>

  <!-- Data extraction rays -->
  <path d="M60 18 L60 32" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <path d="M88 38 L78 46" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M98 60 L84 60" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M22 60 L36 60" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M32 38 L42 46" stroke="#818cf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

  <!-- Ray nodes -->
  <circle cx="60" cy="16" r="2.5" fill="#06b6d4"/>
  <circle cx="90" cy="36" r="2" fill="#818cf8"/>
  <circle cx="100" cy="60" r="2" fill="#6366f1"/>
  <circle cx="20" cy="60" r="2" fill="#6366f1"/>
  <circle cx="30" cy="36" r="2" fill="#818cf8"/>

  <!-- Scraper bolt  extraction motif -->
  <path d="M64 44 L52 62 H58 L56 76 L72 54 H66 Z" fill="url(#wsp-grad)" stroke="rgba(255,255,255,0.3)" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Web arc accents -->
  <path d="M60 32 Q78 38 84 52" stroke="#06b6d4" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M60 32 Q42 38 36 52" stroke="#6366f1" stroke-width="0.8" fill="none" opacity="0.4"/>
  <path d="M36 52 Q42 68 60 72" stroke="#818cf8" stroke-width="0.8" fill="none" opacity="0.35"/>
  <path d="M84 52 Q78 68 60 72" stroke="#06b6d4" stroke-width="0.8" fill="none" opacity="0.35"/>
</svg>
